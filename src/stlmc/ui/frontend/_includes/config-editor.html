<div class="document-pane" id="config-pane">
  <div class="panel-heading"><h3>Configuration editor</h3><span id="config-status" class="muted">Not saved</span></div>
  <label>Local configuration<select id="config-documents"><option value="">Choose a configuration</option></select></label>
  <div class="row"><button id="load-config" type="button" disabled>Load configuration</button><label class="file-button">Open configuration<input id="open-config" type="file" accept=".cfg,text/plain"></label></div>
  <label>Configuration filename<input id="config-name" value="untitled.cfg" autocomplete="off"></label>
  <div class="row"><button id="save-config" type="button" disabled>Save configuration</button><button id="download-config" type="button">Download configuration</button></div>
  <label class="editor-label">Configuration (optional)<textarea id="config" spellcheck="false" placeholder="Optional .cfg contents"></textarea></label>
</div>
