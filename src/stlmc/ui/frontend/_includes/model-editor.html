<div class="document-pane" id="model-pane">
  <div class="panel-heading"><h3>Model editor</h3><span id="model-status" class="muted">Not saved</span></div>
  <label>Local model<select id="documents"><option value="">Choose a model</option></select></label>
  <div class="row"><button id="load-document" type="button" disabled>Load model</button><label class="file-button">Open model file<input id="open-model" type="file" accept=".model,text/plain"></label></div>
  <label>Model filename<input id="model-name" value="untitled.model" autocomplete="off"></label>
  <div class="row"><button id="save-model" type="button" disabled>Save model</button><button id="download-model" type="button">Download model</button></div>
  <label class="editor-label">Model<textarea id="model" spellcheck="false" placeholder="Paste a complete .model file or load a local example."></textarea></label>
</div>
