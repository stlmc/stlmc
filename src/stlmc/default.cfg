# basic section
common {
    # mandatory arguments
    # bound =
    # time-bound =

    threshold = 0.01
    solver = "auto"                 # dreal , yices , z3
    time-horizon = "time-bound"
    parallel = "false"
    visualize = "false"
    goal = "all"
    two-step = "false"
    concrete = "false"
    verbose = "false"               # print verbose messages
    reach = "false"
    only-loop = "false"
    parallel-core = 25
    scenario-batch-size = 1        # scenarios combined in one OR query during two-step enumeration
    save-smt2 = "false"
    smt2-dir = "smt2-logs"
}

# underlying solver
z3      {
    logic = "QF_NRA" # "QF_LRA"
}
yices   {
    logic = "QF_NRA" # "QF_LRA"
}
dreal {
    precision = 0.001
    ode-order = 20
    # ode-step is omitted to use dReal's automatic step control.
    executable-path = "../3rd_party/dReal3/dReal" # dreal executable path
}
