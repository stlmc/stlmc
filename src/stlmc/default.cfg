# basic section
common {
    # mandatory arguments
    # bound =
    # time-bound =

    threshold = 0.01
    solver = "auto"                 # dreal , yices , z3
    time-horizon = "time-bound"
    parallel = "false"
    visualize = "false"
    goal = "all"
    path-strategy = "symbolic"     # symbolic OR encoding or explicit transition paths
    two-step = "false"
    concrete = "false"
    verbose = "false"               # print verbose messages
    reach = "false"
    parallel-core = 25
    solver-batch-size = 1          # candidates combined in one OR query before solver submission
    core-minimize-attempts = 1     # 1 disables extra cardinality-oriented core searches
    save-smt2 = "false"
    smt2-dir = "smt2-logs"
}

# underlying solver
z3      {
    logic = "QF_NRA" # "QF_LRA"
}
yices   {
    logic = "QF_NRA" # "QF_LRA"
}
dreal {
    precision = 0.001
    ode-order = 20
    # ode-step is omitted to use dReal's automatic step control.
    executable-path = "3rd_party/dReal3/dReal" # bundled dReal executable path
}
