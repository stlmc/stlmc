[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stlmc"
version = "1.0.2.dev1"
description = "An SMT-based bounded model checker for signal temporal logic"
readme = "README.md"
license.text = "GPLv3"
keywords = ["stlmc", "model checker", "STL", "signal temporal logic", "bounded model checker"]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
	  "Programming Language :: Python :: 3.11",
	  "Programming Language :: Python :: 3.12",
	  "Programming Language :: Python :: 3.13",
	  "Programming Language :: Python :: 3.14",
	  "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
  "lark==1.3.1",
  "sympy==1.14.0",
  "mpmath==1.3.0",
  "numpy==2.3.5",
  "scipy==1.16.3"
]

[[project.authors]]
name  = "Geunyeol Yu"
email = "rgyen@postech.ac.kr"

[project.scripts]
stlmc = "stlmc.cli.mc:main"
stlmc-vis = "stlmc.cli.visualize:main"
stlmc-gui = "stlmc.cli.ui:main"
stlmc-installer = "stlmc.cli.installer:main"

[project.urls]
"Homepage"      = "https://stlmc.github.io/"
"Bug Tracker"   = "https://github.com/stlmc/stlmc/issues"
"Documentation" = "https://stlmc.github.io/assets/files/stlmc-manual.pdf"
"Source Code"   = "https://github.com/stlmc/stlmc/"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stlmc = ["default.cfg", "parser/grammars/*.lark", "cli/dependency-constraints.txt", "ui/static/*", "ui/static/**/*"]
