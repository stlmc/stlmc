name: Release
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify tag matches package version
      if: github.event_name == 'push'
      shell: bash
      run: |
        package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)
        test "v${package_version}" = "${GITHUB_REF_NAME}" || {
          echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}"
          exit 1
        }
    - name: Validate release notes and publishing identity when publishing
      env:
        RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        RELEASE_TAG: ${{ github.ref_name }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [ "$EVENT_NAME" = "push" ]; then
          test -n "$RELEASE_TOKEN" || {
            echo "Set the RELEASE_TOKEN Actions secret to publish under your own account."
            exit 1
          }
        else
          package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)
          RELEASE_TAG="v${package_version}"
        fi
        python tools/release_notes.py "$RELEASE_TAG" --output /tmp/stlmc-release-notes.md

  build:
    name: Build and test wheel 📦
    needs: validate
    strategy:
      # Run every environment so a failure report is available for each one.
      # The matrix job still fails if any environment fails, which blocks
      # publishing jobs that depend on it.
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          python-version: '3.11'
          architecture: x64
        - os: ubuntu-latest
          python-version: '3.12'
          architecture: x64
        - os: ubuntu-latest
          python-version: '3.13'
          architecture: x64
        - os: ubuntu-latest
          python-version: '3.14'
          architecture: x64
        - os: macos-15
          python-version: '3.11'
          architecture: arm64
        - os: macos-15
          python-version: '3.12'
          architecture: arm64
        - os: macos-15
          python-version: '3.13'
          architecture: arm64
        - os: macos-15
          python-version: '3.14'
          architecture: arm64

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}

    - name: Create an isolated test environment
      run: |
        python3 -m venv .tmp/ci-venv
        echo "$PWD/.tmp/ci-venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$PWD/.tmp/ci-venv" >> "$GITHUB_ENV"

    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build

    - name: Ensure Rosetta is available
      if: matrix.os == 'macos-15'
      run: |
        if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
          sudo softwareupdate --install-rosetta --agree-to-license
        fi

    - name: Build a Linux wheel
      if: matrix.os == 'ubuntu-latest'
      run: python3 -m build --wheel

    - name: Build an Apple Silicon wheel
      if: matrix.os == 'macos-15'
      env:
        # Keep generated metadata compatible with all Apple Silicon releases.
        MACOSX_DEPLOYMENT_TARGET: '11.0'
      run: python3 -m build --wheel

    - name: Install the built wheel
      run: |
        python3 -m pip install --force-reinstall dist/*.whl
        python3 -m pip check
        python3 -c "from stlmc.parser.config_visitor import ConfigVisitor; print('Lark parser loaded')"

    - name: Prepare CUDD on the temporary macOS runner
      if: matrix.os == 'macos-15'
      run: |
        brew tap SRI-CSL/sri-csl
        # The official Yices archive omits CUDD. Prepare it explicitly for CI;
        # this source-build prerequisite is not part of the default installer.
        brew trust --formula sri-csl/sri-csl/cudd
        brew install SRI-CSL/sri-csl/cudd
        # Resolve the official archive's Intel-style CUDD install name using
        # the runner's Homebrew directory. The installer still probes loading.
        echo "DYLD_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

    - name: Install external solvers through STLMC
      run: stlmc-installer install --solver z3 cvc5 yices dreal --visualize html pdf

    - name: Expose managed solver executables to CI subprocesses
      run: python3 tools/setup_ci_solvers.py

    - name: Check solver installation
      run: |
        stlmc-installer check --solver z3 cvc5 yices dreal --visualize html pdf
        python3 -m pip check
        python3 -c "from stlmc.solver.availability import find_dreal; print('STLMC_DREAL=' + find_dreal())" >> "$GITHUB_ENV"

    - name: Render an installed-wheel counterexample as HTML and PDF
      env:
        STLMC_DISABLE_UPDATE_CHECK: '1'
      run: python3 tools/check_release_visualization.py

    - name: Run source regression tests against the installed dependencies
      env:
        # Avoid network update checks during the release test matrix.
        STLMC_DISABLE_UPDATE_CHECK: '1'
      # The official legacy release has one precisely pinned known defect.
      # Keep it visible as XFAIL; every other smoke mismatch remains fatal.
      run: make test-quick PYTHON=python3 SMOKE_ARGS=--allow-known-dreal-bugs

    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions-${{ matrix.os }}-${{ matrix.python-version }}
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
    - validate
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stlmc
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        pattern: python-package-distributions-*
        path: dist/
        merge-multiple: true
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Extract this version's release notes
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: python tools/release_notes.py "$RELEASE_TAG" --output /tmp/stlmc-release-notes.md
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        pattern: python-package-distributions-*
        path: dist/
        merge-multiple: true
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.4.0
      with:
        inputs: >-
          ./dist/*.whl
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        RELEASE_TAG: ${{ github.ref_name }}
        RELEASE_REPO: ${{ github.repository }}
      shell: bash
      run: |
        for attempt in 1 2 3 4 5; do
          # A previous request may have created the release even if GitHub
          # returned a transient 5xx response to the client.
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists"
            exit 0
          fi
          prerelease=()
          if [[ "$RELEASE_TAG" == *".dev"* ]]; then
            prerelease=(--prerelease)
          fi
          if gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" \
              --verify-tag --draft "${prerelease[@]}" --title "$RELEASE_TAG" \
              --notes-file /tmp/stlmc-release-notes.md; then
            exit 0
          fi
          if [ "$attempt" -eq 5 ]; then
            echo "Failed to create GitHub Release after $attempt attempts" >&2
            exit 1
          fi
          sleep $((attempt * 10))
        done
    - name: Upload artifact signatures to GitHub Release
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        RELEASE_TAG: ${{ github.ref_name }}
        RELEASE_REPO: ${{ github.repository }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      shell: bash
      run: |
        for attempt in 1 2 3 4 5; do
          if gh release upload "$RELEASE_TAG" dist/* \
              --repo "$RELEASE_REPO" --clobber; then
            exit 0
          fi
          if [ "$attempt" -eq 5 ]; then
            echo "Failed to upload release artifacts after $attempt attempts" >&2
            exit 1
          fi
          sleep $((attempt * 10))
        done


