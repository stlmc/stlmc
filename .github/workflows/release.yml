name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify tag matches package version
      shell: bash
      run: |
        package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)
        test "v${package_version}" = "${GITHUB_REF_NAME}" || {
          echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}"
          exit 1
        }

  build:
    name: Build and test wheel 📦
    needs: validate
    strategy:
      # Run every environment so a failure report is available for each one.
      # The matrix job still fails if any environment fails, which blocks
      # publishing jobs that depend on it.
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          python-version: '3.8'
          architecture: x64
        - os: ubuntu-latest
          python-version: '3.9'
          architecture: x64
        - os: ubuntu-latest
          python-version: '3.10'
          architecture: x64
        - os: ubuntu-latest
          python-version: '3.11'
          architecture: x64
        - os: ubuntu-latest
          python-version: '3.12'
          architecture: x64
        - os: ubuntu-latest
          python-version: '3.13'
          architecture: x64
        - os: ubuntu-latest
          python-version: '3.14'
          architecture: x64
        # These are the newest CPython releases with Apple Silicon builds
        # available to setup-python for Python 3.8 through 3.10.
        - os: macos-15
          python-version: '3.8.10'
          architecture: arm64
        - os: macos-15
          python-version: '3.9.13'
          architecture: arm64
        - os: macos-15
          python-version: '3.10.11'
          architecture: arm64
        - os: macos-15
          python-version: '3.11'
          architecture: arm64
        - os: macos-15
          python-version: '3.12'
          architecture: arm64
        - os: macos-15
          python-version: '3.13'
          architecture: arm64
        - os: macos-15
          python-version: '3.14'
          architecture: arm64

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}

    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user

    - name: Generate ANTLR parsers
      run: ./build.sh antlr

    - name: Ensure Rosetta is available
      if: matrix.os == 'macos-15'
      run: |
        if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
          sudo softwareupdate --install-rosetta --agree-to-license
        fi

    - name: Build a Linux wheel
      if: matrix.os == 'ubuntu-latest'
      run: python3 -m build --wheel

    - name: Build an Apple Silicon wheel
      if: matrix.os == 'macos-15'
      env:
        # Keep generated metadata compatible with all Apple Silicon releases.
        MACOSX_DEPLOYMENT_TARGET: '11.0'
      run: python3 -m build --wheel

    - name: Install the built wheel
      run: |
        python3 -m pip install --force-reinstall dist/*.whl
        python3 -m pip check
        python3 -c "from stlmc.parser.config_visitor import ConfigVisitor; print('ANTLR parser loaded')"

    - name: Trust Yices formulae on the temporary macOS runner
      if: matrix.os == 'macos-15'
      run: |
        brew tap SRI-CSL/sri-csl
        # Homebrew 6 requires explicit trust for third-party formulae. Limit
        # trust to Yices and its two tap dependencies, not the entire tap.
        brew trust --formula sri-csl/sri-csl/yices2
        brew trust --formula sri-csl/sri-csl/libpoly
        brew trust --formula sri-csl/sri-csl/cudd
        # The yices Python binding only probes the Intel Homebrew prefix by
        # default. Make the Apple Silicon Homebrew library visible to dyld in
        # all subsequent installer, check, and test steps.
        echo "DYLD_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

    - name: Install external solvers through STLMC
      run: stlmc-install-solvers all

    - name: Check solver installation
      run: |
        stlmc-install-solvers --check
        python3 -c "from stlmc.solver.availability import find_dreal; print('STLMC_DREAL=' + find_dreal())" >> "$GITHUB_ENV"

    - name: Test the installed distribution
      env:
        # Avoid network update checks during the release test matrix.
        STLMC_DISABLE_UPDATE_CHECK: '1'
      run: make test-quick PYTHON=python3

    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions-${{ matrix.os }}-${{ matrix.python-version }}
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - validate
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stlmc
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        pattern: python-package-distributions-*
        path: dist/
        merge-multiple: true
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        pattern: python-package-distributions-*
        path: dist/
        merge-multiple: true
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.4.0
      with:
        inputs: >-
          ./dist/*.whl
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
        RELEASE_REPO: ${{ github.repository }}
      shell: bash
      run: |
        for attempt in 1 2 3 4 5; do
          # A previous request may have created the release even if GitHub
          # returned a transient 5xx response to the client.
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists"
            exit 0
          fi
          if gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" --notes ""; then
            exit 0
          fi
          if [ "$attempt" -eq 5 ]; then
            echo "Failed to create GitHub Release after $attempt attempts" >&2
            exit 1
          fi
          sleep $((attempt * 10))
        done
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
        RELEASE_REPO: ${{ github.repository }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      shell: bash
      run: |
        for attempt in 1 2 3 4 5; do
          if gh release upload "$RELEASE_TAG" dist/* \
              --repo "$RELEASE_REPO" --clobber; then
            exit 0
          fi
          if [ "$attempt" -eq 5 ]; then
            echo "Failed to upload release artifacts after $attempt attempts" >&2
            exit 1
          fi
          sleep $((attempt * 10))
        done


