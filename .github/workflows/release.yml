name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify tag matches package version
      shell: bash
      run: |
        package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)
        test "v${package_version}" = "${GITHUB_REF_NAME}" || {
          echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}"
          exit 1
        }

  build:
    name: Build wheel 📦
    needs: validate
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          python-version: '3.8'
        - os: ubuntu-latest
          python-version: '3.9'
        - os: ubuntu-latest
          python-version: '3.10'
        - os: ubuntu-latest
          python-version: '3.11'
        - os: ubuntu-latest
          python-version: '3.12'
        # These are the newest CPython releases with Apple Silicon builds
        # available to setup-python for Python 3.8 through 3.10.
        - os: macos-latest
          python-version: '3.8.10'
        - os: macos-latest
          python-version: '3.9.13'
        - os: macos-latest
          python-version: '3.10.11'
        - os: macos-latest
          python-version: '3.11'
        - os: macos-latest
          python-version: '3.12'

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user

    - name: Prepare prerequisites
      run: ./build.sh prep

    - name: Build a Linux wheel
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt install -y patchelf
        pip install auditwheel
        python3 -m build --wheel
        for whl in dist/*linux_*.whl; do
          auditwheel repair $whl
        done
        rm -rf dist/
        mv wheelhouse dist

    - name: Build an Apple Silicon wheel
      if: matrix.os == 'macos-latest'
      run: |
        # dReal3 is x86_64-only on macOS and runs on Apple Silicon via Rosetta.
        ./3rd_party/dReal3/dReal --version
        python3 -m build --wheel

    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions-${{ matrix.os }}-${{ matrix.python-version }}
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - validate
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stlmc
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        pattern: python-package-distributions-*
        path: dist/
        merge-multiple: true
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        pattern: python-package-distributions-*
        path: dist/
        merge-multiple: true
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v2.1.1
      with:
        inputs: >-
          ./dist/*.whl
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create
        '${{ github.ref_name }}'
        --repo '${{ github.repository }}'
        --notes ""
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      run: >-
        gh release upload
        '${{ github.ref_name }}' dist/**
        --repo '${{ github.repository }}'


